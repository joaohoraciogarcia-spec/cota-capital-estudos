function boot(__P){const D=__P.D;
// ---------- dados ----------
const MK={T:'Itajaí',R:'Praia Brava (Itajaí)',B:'Balneário Camboriú',I:'Itapema',P:'Perequê',V:'Vivapark'};const MS={T:'Itajaí',R:'Brava',B:'BC',I:'Itapema',P:'Perequê',V:'Vivapark'};const CH={T:'ITJ',R:'BRV',B:'BC',I:'ITA',P:'PQ',V:'VP'};
const recs=D.map(r=>{const [m,dev,cons,t,dorm,su,gar,area,price,prog,upd]=r;
  const tipo={R:'Residencial',S:'Sala',C:'Casa',L:'Lote'}[t];
  const pm2=price&&area?price/area:null;
  const fase=prog===100?'Pronto':(prog!=null&&prog<=10?'Lançamento':'Em obra');
  return {m,dev,cons,tipo,dorm,su,gar,area,price,prog,upd,pm2,fase};});
const RES=recs.filter(x=>x.tipo==='Residencial');
const med=a=>{a=a.filter(v=>v!=null&&isFinite(v)).sort((x,y)=>x-y);if(!a.length)return null;const k=a.length>>1;return a.length%2?a[k]:(a[k-1]+a[k])/2};
const brl=v=>v==null?'—':v>=1e6?'R$ '+(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi':'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil';
const k1=v=>v==null?'—':'R$ '+(v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mil';
const pct=v=>Math.round(v*100)+'%';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SC={T:'var(--s-t)',R:'var(--s-r)',B:'var(--s-b)',I:'var(--s-i)',P:'var(--s-p)',V:'var(--s-v)'};
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;if(parent)parent.appendChild(e);return e}
const tip=document.getElementById('tip');
function showTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+14,y=ev.clientY-h-10;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y<8)y=ev.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.opacity=0}
function hover(node,fn){node.addEventListener('mousemove',e=>showTip(e,fn()));node.addEventListener('mouseleave',hideTip);node.style.cursor='default'}
const byM=m=>RES.filter(x=>x.m===m);

// ---------- KPIs ----------
(function(){
  const rows=['T','R','B','I','P','V'].map(m=>{const g=byM(m);const pr=g.filter(x=>x.price);
    return [MK[m],g.length,med(pr.map(x=>x.price)),med(g.map(x=>x.pm2)),g.filter(x=>x.fase==='Pronto').length/g.length,g.filter(x=>x.fase==='Lançamento').length/g.length,new Set(g.map(x=>x.cons)).size]});
  let h='<thead><tr><th>Mercado</th><th>Empreend. residenciais</th><th>Ticket mediano</th><th>R$/m² mediano</th><th>Prontos</th><th>Lançamento (≤10% obra)</th><th>Construtoras</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{const m='TRBIPV'[i];h+=`<tr><td><span class="key"><i class="sw ${m.toLowerCase()}"></i>${r[0]}</span></td><td class="big">${r[1]}</td><td>${brl(r[2])}</td><td>${k1(r[3])}</td><td>${pct(r[4])}</td><td>${pct(r[5])}</td><td>${r[6]}</td></tr>`});
  document.getElementById('kpi').innerHTML=h+'</tbody>';
})();

// ---------- barras agrupadas ----------
function grouped(id,cats,series,{fmt,axisFmt,max,note}){
  const W=560,H=280,m={t:22,r:8,b:34,l:52};const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'},null);
  const mx=max||Math.max(...series.flatMap(s=>s.values.map(v=>v?.v||0)))*1.12;
  const ticks=niceTicks(0,mx,4);const y=v=>m.t+ih-(v/ticks[ticks.length-1])*ih;
  ticks.forEach(t=>{el('line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),stroke:'var(--grid)','stroke-width':1},svg);el('text',{x:m.l-8,y:y(t)+4,'text-anchor':'end'},svg,axisFmt(t))});
  const bw=iw/cats.length,gap=2,inner=Math.min(34,(bw*0.84)/series.length);
  cats.forEach((c,ci)=>{const x0=m.l+ci*bw+bw/2-(inner*series.length+gap*(series.length-1))/2;
    el('text',{x:m.l+ci*bw+bw/2,y:H-12,'text-anchor':'middle',class:'lbl'},svg,c);
    series.forEach((s,si)=>{const d=s.values[ci];if(!d||d.v==null)return;const x=x0+si*(inner+gap);const yy=y(d.v),h=m.t+ih-yy;
      const p=el('path',{d:roundTop(x,yy,inner,h,Math.min(4,inner/2)),fill:s.color},svg);
      if(d.lab!==false&&inner>=24)el('text',{x:x+inner/2,y:yy-6,'text-anchor':'middle',class:'val','font-size':series.length>3?8:(series.length>2?9:10)},svg,d.short);
      const hit=el('rect',{x:x-gap,y:m.t,width:inner+gap*2,height:ih,fill:'transparent'},svg);
      hover(hit,()=>`<b>${s.name} · ${c}</b><br>${fmt(d)}`)})});
  el('line',{x1:m.l,x2:W-m.r,y1:m.t+ih,y2:m.t+ih,stroke:'var(--muted)','stroke-width':1},svg);
  document.getElementById(id).appendChild(svg);
}
function roundTop(x,y,w,h,r){if(h<=0)return '';r=Math.min(r,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function niceTicks(a,b,n){const span=b-a,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),f=step0/mag;const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const out=[];for(let v=0;v<=b+step*0.01;v+=step)out.push(v);if(out[out.length-1]<b)out.push(out[out.length-1]+step);return out}

// R$/m² por tipologia
(function(){const cats=['1 dorm','2 dorm','3 dorm','4 dorm'];
  const ser=['T','R','B','I','P'].map(m=>({name:MS[m],color:SC[m],values:[1,2,3,4].map(d=>{const g=byM(m).filter(x=>x.dorm===d);const v=med(g.map(x=>x.pm2));return {v,n:g.filter(x=>x.pm2).length,a:med(g.map(x=>x.area)),t:med(g.map(x=>x.price)),short:v?(v/1e3).toFixed(1).replace('.',','):''}})}));
  grouped('c-pm2',cats,ser,{axisFmt:t=>(t/1e3)+' mil',fmt:d=>`R$/m² mediano: <b>${k1(d.v)}</b><br>Ticket mediano: ${brl(d.t)}<br>Área mediana: ${Math.round(d.a)} m²<br>n = ${d.n} empreendimentos${d.n<10?'<br><i>amostra pequena</i>':''}`});})();

    const hit=el('circle',{cx,cy,r:9,fill:'transparent'},svg);hit.dataset.m=p.m;G.push(hit);
    hover(hit,()=>`<b>${p.dev}</b><br>${p.cons} · ${MK[p.m]}<br>${p.dorm||'—'} dorm · ${p.area.toLocaleString('pt-BR')} m²<br>${brl(p.price)} · ${k1(p.pm2)}/m²<br>${p.fase}${p.prog!=null&&p.fase==='Em obra'?' ('+p.prog+'%)':''}`)});

(function(){const $=id=>document.getElementById(id);const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

  async function decrypt(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(VAULT.s),iterations:VAULT.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(VAULT.i)},key,ub(VAULT.c))))}
  async function saveLead(lead){try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
