function boot(__P){const D=__P.D;
// ---------- dados ----------
const MK={T:'Itajaí',R:'Praia Brava (Itajaí)',B:'Balneário Camboriú',I:'Itapema',P:'Perequê',V:'Vivapark'};const MS={T:'Itajaí',R:'Brava',B:'BC',I:'Itapema',P:'Perequê',V:'Vivapark'};const CH={T:'ITJ',R:'BRV',B:'BC',I:'ITA',P:'PQ',V:'VP'};
const recs=D.map(r=>{const [m,dev,cons,t,dorm,su,gar,area,price,prog,upd]=r;
  const tipo={R:'Residencial',S:'Sala',C:'Casa',L:'Lote'}[t];
  const pm2=price&&area?price/area:null;
  const fase=prog===100?'Pronto':(prog!=null&&prog<=10?'Lançamento':'Em obra');
  return {m,dev,cons,tipo,dorm,su,gar,area,price,prog,upd,pm2,fase};});
const RES=recs.filter(x=>x.tipo==='Residencial');
const med=a=>{a=a.filter(v=>v!=null&&isFinite(v)).sort((x,y)=>x-y);if(!a.length)return null;const k=a.length>>1;return a.length%2?a[k]:(a[k-1]+a[k])/2};
const brl=v=>v==null?'—':v>=1e6?'R$ '+(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi':'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil';
const k1=v=>v==null?'—':'R$ '+(v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mil';
const pct=v=>Math.round(v*100)+'%';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SC={T:'var(--s-t)',R:'var(--s-r)',B:'var(--s-b)',I:'var(--s-i)',P:'var(--s-p)',V:'var(--s-v)'};
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;if(parent)parent.appendChild(e);return e}
const tip=document.getElementById('tip');
function showTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+14,y=ev.clientY-h-10;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y<8)y=ev.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.opacity=0}
function hover(node,fn){node.addEventListener('mousemove',e=>showTip(e,fn()));node.addEventListener('mouseleave',hideTip);node.style.cursor='default'}
const byM=m=>RES.filter(x=>x.m===m);

// ---------- KPIs ----------
(function(){
  const rows=['T','R','B','I','P','V'].map(m=>{const g=byM(m);const pr=g.filter(x=>x.price);
    return [MK[m],g.length,med(pr.map(x=>x.price)),med(g.map(x=>x.pm2)),g.filter(x=>x.fase==='Pronto').length/g.length,g.filter(x=>x.fase==='Lançamento').length/g.length,new Set(g.map(x=>x.cons)).size]});
  let h='<thead><tr><th>Mercado</th><th>Empreend. residenciais</th><th>Ticket mediano</th><th>R$/m² mediano</th><th>Prontos</th><th>Lançamento (≤10% obra)</th><th>Construtoras</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{const m='TRBIPV'[i];h+=`<tr><td><span class="key"><i class="sw ${m.toLowerCase()}"></i>${r[0]}</span></td><td class="big">${r[1]}</td><td>${brl(r[2])}</td><td>${k1(r[3])}</td><td>${pct(r[4])}</td><td>${pct(r[5])}</td><td>${r[6]}</td></tr>`});
  document.getElementById('kpi').innerHTML=h+'</tbody>';
})();

// ---------- barras agrupadas ----------
function grouped(id,cats,series,{fmt,axisFmt,max,note}){
  const W=560,H=280,m={t:22,r:8,b:34,l:52};const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'},null);
  const mx=max||Math.max(...series.flatMap(s=>s.values.map(v=>v?.v||0)))*1.12;
  const ticks=niceTicks(0,mx,4);const y=v=>m.t+ih-(v/ticks[ticks.length-1])*ih;
  ticks.forEach(t=>{el('line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),stroke:'var(--grid)','stroke-width':1},svg);el('text',{x:m.l-8,y:y(t)+4,'text-anchor':'end'},svg,axisFmt(t))});
  const bw=iw/cats.length,gap=2,inner=Math.min(34,(bw*0.84)/series.length);
  cats.forEach((c,ci)=>{const x0=m.l+ci*bw+bw/2-(inner*series.length+gap*(series.length-1))/2;
    el('text',{x:m.l+ci*bw+bw/2,y:H-12,'text-anchor':'middle',class:'lbl'},svg,c);
    series.forEach((s,si)=>{const d=s.values[ci];if(!d||d.v==null)return;const x=x0+si*(inner+gap);const yy=y(d.v),h=m.t+ih-yy;
      const p=el('path',{d:roundTop(x,yy,inner,h,Math.min(4,inner/2)),fill:s.color},svg);
      if(d.lab!==false&&inner>=24)el('text',{x:x+inner/2,y:yy-6,'text-anchor':'middle',class:'val','font-size':series.length>3?8:(series.length>2?9:10)},svg,d.short);
      const hit=el('rect',{x:x-gap,y:m.t,width:inner+gap*2,height:ih,fill:'transparent'},svg);
      hover(hit,()=>`<b>${s.name} · ${c}</b><br>${fmt(d)}`)})});
  el('line',{x1:m.l,x2:W-m.r,y1:m.t+ih,y2:m.t+ih,stroke:'var(--muted)','stroke-width':1},svg);
  document.getElementById(id).appendChild(svg);
}
function roundTop(x,y,w,h,r){if(h<=0)return '';r=Math.min(r,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function niceTicks(a,b,n){const span=b-a,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),f=step0/mag;const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const out=[];for(let v=0;v<=b+step*0.01;v+=step)out.push(v);if(out[out.length-1]<b)out.push(out[out.length-1]+step);return out}

// R$/m² por tipologia
(function(){const cats=['1 dorm','2 dorm','3 dorm','4 dorm'];
  const ser=['T','R','B','I','P'].map(m=>({name:MS[m],color:SC[m],values:[1,2,3,4].map(d=>{const g=byM(m).filter(x=>x.dorm===d);const v=med(g.map(x=>x.pm2));return {v,n:g.filter(x=>x.pm2).length,a:med(g.map(x=>x.area)),t:med(g.map(x=>x.price)),short:v?(v/1e3).toFixed(1).replace('.',','):''}})}));

const BANDS=[[0,7e5,'< 700 mil'],[7e5,1e6,'700 mil–1 mi'],[1e6,1.5e6,'1–1,5 mi'],[1.5e6,2.5e6,'1,5–2,5 mi'],[2.5e6,4e6,'2,5–4 mi'],[4e6,1e12,'> 4 mi']];

// dispersão log-log
(function(){const W=1080,H=440,m={t:14,r:34,b:40,l:64};const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const pts=RES.filter(x=>x.price&&x.area);const lx=[25,500],ly=[3e5,3e7];
  const X=v=>m.l+(Math.log(v)-Math.log(lx[0]))/(Math.log(lx[1])-Math.log(lx[0]))*iw;
  const Y=v=>m.t+ih-(Math.log(v)-Math.log(ly[0]))/(Math.log(ly[1])-Math.log(ly[0]))*ih;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`},null);
  [30,50,70,100,150,200,300,500].forEach(t=>{el('line',{x1:X(t),x2:X(t),y1:m.t,y2:m.t+ih,stroke:'var(--grid)'},svg);el('text',{x:X(t),y:H-18,'text-anchor':'middle'},svg,t+' m²')});
  [5e5,1e6,2e6,5e6,1e7,2e7].forEach(t=>{el('line',{x1:m.l,x2:W-m.r,y1:Y(t),y2:Y(t),stroke:'var(--grid)'},svg);el('text',{x:m.l-8,y:Y(t)+4,'text-anchor':'end'},svg,t>=1e6?(t/1e6)+' mi':(t/1e3)+' mil')});
  el('rect',{x:X(66),y:m.t,width:X(70.5)-X(66),height:ih,fill:'var(--accent-soft)',opacity:.7},svg);
  el('text',{x:X(70.5)+6,y:m.t+14,style:'fill:var(--accent)'},svg,'66–70 m²');
  const order={V:0,P:1,I:2,T:3,B:4,R:5};const G=[];
  pts.sort((a,b)=>order[b.m]-order[a.m]).forEach(p=>{const cx=X(Math.min(p.area,lx[1])),cy=Y(p.price);let s;
    if(p.m==='T')s=el('path',{d:`M${cx-5},${cy-4}L${cx+5},${cy-4}L${cx},${cy+5}Z`,fill:SC.T,stroke:'var(--panel)','stroke-width':1.3},svg);
    else if(p.m==='R')s=el('path',{d:`M${cx-5},${cy+4}L${cx+5},${cy+4}L${cx},${cy-5}Z`,fill:SC.R,stroke:'var(--panel)','stroke-width':1.3},svg);
    else if(p.m==='I')s=el('rect',{x:cx-4,y:cy-4,width:8,height:8,fill:SC.I,stroke:'var(--panel)','stroke-width':1.5},svg);
    else if(p.m==='P')s=el('path',{d:`M${cx},${cy-5.5}L${cx+5.5},${cy}L${cx},${cy+5.5}L${cx-5.5},${cy}Z`,fill:SC.P,stroke:'var(--panel)','stroke-width':1.5},svg);
    else if(p.m==='B')s=el('circle',{cx,cy,r:4.8,fill:SC.B,stroke:'var(--panel)','stroke-width':1.5},svg);
    else s=el('circle',{cx,cy,r:4.5,fill:'var(--panel)',stroke:SC.V,'stroke-width':2.2},svg);
    s.dataset.m=p.m;G.push(s);
    const hit=el('circle',{cx,cy,r:9,fill:'transparent'},svg);hit.dataset.m=p.m;G.push(hit);
    hover(hit,()=>`<b>${p.dev}</b><br>${p.cons} · ${MK[p.m]}<br>${p.dorm||'—'} dorm · ${p.area.toLocaleString('pt-BR')} m²<br>${brl(p.price)} · ${k1(p.pm2)}/m²<br>${p.fase}${p.prog!=null&&p.fase==='Em obra'?' ('+p.prog+'%)':''}`)});
  el('line',{x1:m.l,x2:W-m.r,y1:m.t+ih,y2:m.t+ih,stroke:'var(--muted)'},svg);
  const wrap=document.getElementById('c-scatter');wrap.style.overflowX='auto';svg.style.minWidth='620px';wrap.appendChild(svg);
  document.querySelectorAll('#sc-btns button').forEach(bt=>bt.addEventListener('click',()=>{const s=bt.dataset.s;document.querySelectorAll('#sc-btns button').forEach(o=>o.setAttribute('aria-pressed',o===bt));G.forEach(e=>{const on=s==='all'||e.dataset.m===s||(s==='P'&&e.dataset.m==='V');e.style.opacity=on?1:.12;e.style.pointerEvents=on?'':'none'})}));})();

// heatmaps
function heat(id,m){const g=byM(m).filter(x=>x.price);const D4=[['1 dorm',1],['2 dorm',2],['3 dorm',3],['4+ dorm',4]];
  const W=560,cw=(W-70)/BANDS.length,chh=46,H=D4.length*chh+40;const svg=el('svg',{viewBox:`0 0 ${W} ${H}`},null);
  const cnt=D4.map(([_,d])=>BANDS.map(b=>g.filter(x=>(d===4?x.dorm>=4:x.dorm===d)&&x.price>=b[0]&&x.price<b[1]).length));
  const lvl=n=>n===0?0:n<=2?1:n<=7?2:n<=20?3:4;
  D4.forEach(([lab],ri)=>{el('text',{x:62,y:ri*chh+chh/2+4,'text-anchor':'end',class:'lbl'},svg,lab);
    BANDS.forEach((b,ci)=>{const n=cnt[ri][ci],L=lvl(n);const x=70+ci*cw,y=ri*chh;
      const r=el('rect',{x:x+1,y:y+1,width:cw-2,height:chh-2,fill:`var(--heat-${L})`},svg);
      el('text',{x:x+cw/2,y:y+chh/2+4,'text-anchor':'middle',class:'val',style:`fill:${L>=3?'var(--bg)':'var(--ink)'}`},svg,n);
      hover(r,()=>`<b>${MK[m]} · ${lab} · ${b[2]}</b><br>${n} empreendimento${n===1?'':'s'}`)})});
  BANDS.forEach((b,ci)=>el('text',{x:70+ci*cw+cw/2,y:H-16,'text-anchor':'middle'},svg,b[2].replace(' mil','k')));
  document.getElementById(id).appendChild(svg);
  const lg=document.createElement('div');lg.className='legend';lg.innerHTML=['0','1–2','3–7','8–20','21+'].map((t,i)=>`<span class="key"><i class="sw" style="background:var(--heat-${i});outline:1px solid var(--rule)"></i>${t}</span>`).join('');
  document.getElementById(id).appendChild(lg)}
heat('h-t','T');heat('h-r','R');heat('h-b','B');heat('h-i','I');heat('h-p','P');

// ---------- concorrência ----------
(function(){const by={};RES.forEach(x=>{(by[x.cons]=by[x.cons]||[]).push(x)});
  const top=Object.entries(by).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0])).slice(0,18);const mx=top[0][1].length;
  const seg=(v)=>{const p=med(v.map(x=>x.pm2));const d4=v.filter(x=>x.dorm>=4).length/v.length;if(p&&p>=28000)return 'Luxo frente-mar';if(d4>=.5)return 'Alto padrão';if(p&&p<15500)return 'Volume / entrada';return 'Médio-alto'};
  let h='<thead><tr><th>Construtora</th><th class="r">Empreend.</th><th></th><th>Mercados</th><th class="r">R$/m² mediano</th><th class="r">Ticket mediano</th><th>Mix de dormitórios</th><th>Posição</th></tr></thead><tbody>';
  top.forEach(([c,v])=>{const ms=['T','R','B','I','P','V'].filter(m=>v.some(x=>x.m===m));const mix=[1,2,3,4].map(d=>[d,v.filter(x=>d===4?x.dorm>=4:x.dorm===d).length]).filter(a=>a[1]).map(a=>`${a[1]}×${a[0]===4?'4+':a[0]}d`).join(' ');
    h+=`<tr><td><b>${c}</b></td><td class="r">${v.length}</td><td><span class="bar" style="width:${Math.round(v.length/mx*90)}px"></span></td><td><span class="chips">${ms.map(m=>`<span class="chip ${m}">${CH[m]}</span>`).join('')}</span></td><td class="r">${k1(med(v.map(x=>x.pm2)))}</td><td class="r">${brl(med(v.filter(x=>x.price).map(x=>x.price)))}</td><td class="seg">${mix}</td><td class="seg">${seg(v)}</td></tr>`});
  document.getElementById('t-comp').innerHTML=h+'</tbody>';})();

  const all=recs.slice().sort((a,b)=>(a.price==null)-(b.price==null)||(a.price||0)-(b.price||0));

    f.slice(0,lim).forEach(x=>{h+=`<tr><td><b>${x.dev}</b></td><td>${x.cons}</td><td><span class="chip ${x.m}">${CH[x.m]}</span></td><td class="seg">${x.tipo}</td><td class="r">${x.dorm||'—'}</td><td class="r">${x.gar||'—'}</td><td class="r">${x.area?x.area.toLocaleString('pt-BR'):'—'}</td><td class="seg">${x.fase}${x.fase==='Em obra'?' '+x.prog+'%':''}</td><td class="r">${x.price?brl(x.price):'<span class="seg">Tabela fechada</span>'}</td><td class="r">${x.pm2?k1(x.pm2):'—'}</td></tr>`});

(function(){const $=id=>document.getElementById(id);const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  document.body.classList.add('locked');
  const F={nome:$('g-nome'),wa:$('g-wa'),emp:$('g-emp'),mail:$('g-mail')};
  try{const s=JSON.parse(localStorage.getItem('cci-lead')||'{}');for(const k in F)if(s[k])F[k].value=s[k]}catch(e){}
  F.wa.addEventListener('input',()=>{let d=F.wa.value.replace(/\D/g,'').slice(0,11);F.wa.value=d.length>6?'('+d.slice(0,2)+') '+d.slice(2,d.length-4)+'-'+d.slice(-4):d.length>2?'('+d.slice(0,2)+') '+d.slice(2):d});
  async function decrypt(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(VAULT.s),iterations:VAULT.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(VAULT.i)},key,ub(VAULT.c))))}
  async function saveLead(lead){try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
      const id=await user.id();if(!id)return;const ref=db.doc('leads/'+id);let prev={};try{const s=await ref.get();if(s.exists)prev=s.data()||{}}catch(e){}
      await ref.set(Object.assign({},lead,{primeiroAcesso:prev.primeiroAcesso||lead.ultimoAcesso,acessos:(prev.acessos||0)+1}))}catch(e){}}
  $('g-form').addEventListener('submit',async ev=>{ev.preventDefault();const msg=$('g-msg');msg.textContent='';
    const pw=$('g-pw').value;const bad=[];if(!pw)bad.push($('g-pw'));if(F.nome.value.trim().split(/\s+/).length<2)bad.push(F.nome);if(F.wa.value.replace(/\D/g,'').length<10)bad.push(F.wa);
    if(F.mail.value&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.mail.value))bad.push(F.mail);
    Object.values(F).concat($('g-pw')).forEach(i=>i.setAttribute('aria-invalid',bad.includes(i)));
    if(bad.length){msg.textContent=!pw?'Informe a senha de acesso.':'Confira os campos destacados: nome e sobrenome e WhatsApp com DDD.';bad[0].focus();return}
    const btn=$('g-go');btn.disabled=true;btn.textContent='Verificando…';let P;
    try{P=await decrypt(pw)}catch(e){btn.disabled=false;btn.textContent='Acessar o report';$('g-pw').setAttribute('aria-invalid','true');msg.textContent='Senha incorreta. Confira a senha que você recebeu.';$('g-pw').focus();return}
    const lead={nome:F.nome.value.trim(),whatsapp:F.wa.value.trim(),empresa:F.emp.value.trim(),email:F.mail.value.trim(),ultimoAcesso:new Date().toISOString()};
    try{localStorage.setItem('cci-lead',JSON.stringify({nome:lead.nome,wa:lead.whatsapp,emp:lead.empresa,mail:lead.email}))}catch(e){}
    saveLead(lead);cciWeb(lead);
    const app=$('app');app.innerHTML=P.body;app.hidden=false;$('gate').remove();document.body.classList.remove('locked');window.scrollTo(0,0);boot(P)});
})();</script>
