function boot(__P){const D=__P.D;const RB=__P.RB;const RL=__P.RL;const RH=__P.RH;
const CN={PIC:'Piçarras',PEN:'Penha',BV:'Barra Velha'};const CC={PIC:'var(--z-n)',PEN:'var(--z-s)',BV:'var(--z-l)'};const CIT=['PIC','PEN','BV'];
const recs=D.map(r=>{const [c,dev,cons,t,dorm,su,gar,area,price,prog,upd,lat,lon,street]=r;
  const tipo={A:'Apartamento',L:'Lote',C:'Casa',S:'Sala comercial'}[t];const pm2=price&&area?price/area:null;
  const fase=prog===100?'Pronto':(prog!=null&&prog<=10?'Lançamento':'Em obra');
  return {c,dev,cons,tipo,dorm,su,gar,area,price,prog,upd,lat,lon,street,pm2,fase};});
const AP=recs.filter(x=>x.tipo==='Apartamento');const APc=c=>AP.filter(x=>x.c===c);
const med=a=>{a=a.filter(v=>v!=null&&isFinite(v)).sort((x,y)=>x-y);if(!a.length)return null;const k=a.length>>1;return a.length%2?a[k]:(a[k-1]+a[k])/2};
const brl=v=>v==null?'—':v>=1e6?'R$ '+(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi':'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil';
const k1=v=>v==null?'—':'R$ '+(v/1e3).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mil';
const pct=v=>Math.round(v*100)+'%';
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;if(parent)parent.appendChild(e);return e}
const tip=document.getElementById('tip');
function showTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+14,y=ev.clientY-h-10;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y<8)y=ev.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.opacity=0}
function hover(node,fn){node.addEventListener('mousemove',e=>showTip(e,fn()));node.addEventListener('mouseleave',hideTip);node.style.cursor='default'}
function roundTop(x,y,w,h,r){if(h<=0)return '';r=Math.min(r,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function niceTicks(a,b,n){const span=b-a,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),f=step0/mag;const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const out=[];for(let v=0;v<=b+step*0.01;v+=step)out.push(v);if(out[out.length-1]<b)out.push(out[out.length-1]+step);return out}
function mark(svg,c,cx,cy,r){if(c==='PIC')return el('rect',{x:cx-r,y:cy-r,width:2*r,height:2*r,fill:CC.PIC,stroke:'var(--panel)','stroke-width':1.5},svg);if(c==='PEN')return el('path',{d:`M${cx},${cy-r*1.3}L${cx+r*1.3},${cy}L${cx},${cy+r*1.3}L${cx-r*1.3},${cy}Z`,fill:CC.PEN,stroke:'var(--panel)','stroke-width':1.5},svg);return el('circle',{cx,cy,r:r*1.1,fill:CC.BV,stroke:'var(--panel)','stroke-width':1.5},svg)}
// grouped bars: items [{c, s:[{v,col,name,tip}]}]
function gbars(id,items,{axisFmt,lab}){const W=560,H=260,m={t:22,r:8,b:34,l:52};const iw=W-m.l-m.r,ih=H-m.t-m.b;const svg=el('svg',{viewBox:`0 0 ${W} ${H}`},null);
  const mx=Math.max(...items.flatMap(d=>d.s.map(s=>s.v||0)))*1.14;const ticks=niceTicks(0,mx,4);const top=ticks[ticks.length-1];const y=v=>m.t+ih-(v/top)*ih;
  ticks.forEach(t=>{el('line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),stroke:'var(--grid)'},svg);el('text',{x:m.l-8,y:y(t)+4,'text-anchor':'end'},svg,axisFmt(t))});
  const bw=iw/items.length,ns=items[0].s.length,w=Math.min(38,(bw*.78)/ns);
  items.forEach((d,i)=>{const cx=m.l+i*bw+bw/2;el('text',{x:cx,y:H-12,'text-anchor':'middle',class:'lbl'},svg,d.c);
    d.s.forEach((s,j)=>{if(s.v==null)return;const x=cx-(ns*w+(ns-1)*2)/2+j*(w+2),yy=y(s.v);el('path',{d:roundTop(x,yy,w,m.t+ih-yy,4),fill:s.col},svg);
      el('text',{x:x+w/2,y:yy-6,'text-anchor':'middle',class:'val','font-size':10},svg,lab(s.v));const hit=el('rect',{x,y:m.t,width:w+2,height:ih,fill:'transparent'},svg);hover(hit,()=>s.tip)})});
  el('line',{x1:m.l,x2:W-m.r,y1:m.t+ih,y2:m.t+ih,stroke:'var(--muted)'},svg);document.getElementById(id).appendChild(svg)}
const kfmt=v=>(v/1e3).toFixed(1).replace('.',',');
// KPI
(function(){const cols=['Cidade','Empreend. de apartamentos','Ticket mediano','R$/m² mediano','Área mediana','Prontos','Lançamento (≤10% obra)','Construtoras'];
  let h='<thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
  CIT.forEach(c=>{const A=APc(c);h+=`<tr><td><span class="key"><i class="sw ${c.toLowerCase()}"></i>${CN[c]}</span></td><td class="big">${A.length}</td><td>${brl(med(A.map(x=>x.price)))}</td><td>${k1(med(A.map(x=>x.pm2)))}</td><td>${Math.round(med(A.map(x=>x.area)))} m²</td><td>${A.filter(x=>x.fase==='Pronto').length}</td><td>${A.filter(x=>x.fase==='Lançamento').length}</td><td>${new Set(recs.filter(x=>x.c===c).map(x=>x.cons)).size}</td></tr>`});
  document.getElementById('kpi').innerHTML=h+'</tbody>'})();

(function(){const $=id=>document.getElementById(id);const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

  async function decrypt(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(VAULT.s),iterations:VAULT.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(VAULT.i)},key,ub(VAULT.c))))}
  async function saveLead(lead){try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
      const id=await user.id();if(!id)return;const ref=db.doc('leads/'+id);let prev={};try{const s=await ref.get();if(s.exists)prev=s.data()||{}}catch(e){}
      await ref.set(Object.assign({},lead,{primeiroAcesso:prev.primeiroAcesso||lead.ultimoAcesso,acessos:(prev.acessos||0)+1}))}catch(e){}}
  $('g-form').addEventListener('submit',async ev=>{ev.preventDefault();const msg=$('g-msg');msg.textContent='';
    const pw=$('g-pw').value;const bad=[];if(!pw)bad.push($('g-pw'));if(F.nome.value.trim().split(/\s+/).length<2)bad.push(F.nome);if(F.wa.value.replace(/\D/g,'').length<10)bad.push(F.wa);

    const app=$('app');app.innerHTML=P.body;app.hidden=false;$('gate').remove();document.body.classList.remove('locked');window.scrollTo(0,0);boot(P)});
