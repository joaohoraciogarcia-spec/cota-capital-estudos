const recs=D.map(r=>{const [z,dev,cons,t,dorm,su,gar,area,price,prog,upd,lat,lon,street]=r;
  const tipo={A:'Apartamento',L:'Lote',C:'Casa'}[t];const pm2=price&&area?price/area:null;

const tip=document.getElementById('tip');
