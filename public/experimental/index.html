<style>
/* Layout: relatório editorial escuro, coluna de leitura de ~72rem, seções numeradas como capítulos do estudo; painéis de gráfico em grade 2-up que empilha no celular */
:root{
  --bg:#F3F2EE; --panel:#FFFFFF; --ink:#16181B; --ink-2:#4A4D52; --muted:#74777C; --rule:#DAD8D2; --grid:#E6E4DE;

  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif; --f-mono:"Space Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191C; --panel:#1F2226; --ink:#ECEAE4; --ink-2:#C3C1BA; --muted:#8E9095; --rule:#33363B; --grid:#2A2D32;
  --accent:#D4AE45; --accent-soft:#3A3220; --alert:#E07A6E; --alert-soft:#3A2323;
  --z-n:#5B8BD9; --z-s:#B98A22; --z-l:#3F9A6E; --s-t:#9480D8; --s-r:#2FA88C; --s-b:#C04A5C; --s-i:#5B8BD9; --s-p:#B98A22; --s-v:#B98A22;
  --heat-0:#23262A; --heat-1:#3B3524; --heat-2:#6A5623; --heat-3:#9C7B25; --heat-4:#D4AE45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191C; --panel:#1F2226; --ink:#ECEAE4; --ink-2:#C3C1BA; --muted:#8E9095; --rule:#33363B; --grid:#2A2D32;
  --accent:#D4AE45; --accent-soft:#3A3220; --alert:#E07A6E; --alert-soft:#3A2323;
  --z-n:#5B8BD9; --z-s:#B98A22; --z-l:#3F9A6E; --s-t:#9480D8; --s-r:#2FA88C; --s-b:#C04A5C; --s-i:#5B8BD9; --s-p:#B98A22; --s-v:#B98A22;
  --heat-0:#23262A; --heat-1:#3B3524; --heat-2:#6A5623; --heat-3:#9C7B25; --heat-4:#D4AE45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);padding-inline:20px;padding-block:0 64px}
.wrap{max-width:74rem;margin:0 auto}
header.top{padding-block:40px 28px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 40px;align-items:center}
header.top .htxt{display:grid;gap:18px;min-width:0}
.logo{background:#FFFFFF;border:1px solid var(--rule);padding:14px;width:clamp(150px,18vw,210px)}
.logo img{display:block;width:100%;height:auto}
@media (max-width:760px){header.top{grid-template-columns:1fr}.logo{order:-1;width:120px;padding:8px}}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:700 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brand .mark{width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--accent);font:800 11px/1 var(--f-display);letter-spacing:0}
.brand .meta{color:var(--muted);letter-spacing:.08em}
h1{font:800 clamp(30px,5.2vw,54px)/1.02 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:20ch}
h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:17px;color:var(--ink-2);max-width:68ch;margin:0}
.scope{display:flex;flex-wrap:wrap;gap:8px 20px;font:400 12px/1.4 var(--f-mono);color:var(--muted)}
.scope b{color:var(--ink);font-weight:700}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;display:inline-block}
.sw.g{background:var(--z-n)} .sw.c{background:var(--z-s);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)} .chip.G{background:var(--z-n)} .chip.C{background:var(--z-s)}
.sw.zn{background:var(--z-n)} .sw.zs{background:var(--z-s);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)} .sw.zl{background:var(--z-l);border-radius:50%} .chip.N{background:var(--z-n)} .chip.S{background:var(--z-s)} .chip.L{background:var(--z-l)}
.sw.t{background:var(--s-t);clip-path:polygon(0 0,100% 0,50% 100%)} .sw.r{background:var(--s-r);clip-path:polygon(50% 0,100% 100%,0 100%)} .sw.b{background:var(--s-b);border-radius:50%} .sw.i{background:var(--s-i)} .sw.p{background:var(--s-p);border-radius:2px} .sw.v{background:transparent;border:2px solid var(--s-v);border-radius:50%}
section{padding-block:44px 8px;display:grid;gap:22px}
.sec-h{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:baseline}
.sec-n{font:700 13px/1 var(--f-mono);color:var(--accent)}
h2{font:800 clamp(22px,3vw,30px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sec-h p{grid-column:2;margin:0;color:var(--ink-2);max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:18px}
.panel{background:var(--panel);border:1px solid var(--rule);padding:20px;min-width:0;display:grid;gap:12px;align-content:start}
.panel h3{font:700 16px/1.25 var(--f-display);margin:0}
.panel .sub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.panel .read{font-size:14px;color:var(--ink-2);margin:0;border-top:1px solid var(--rule);padding-top:10px}
.panel .read b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:400 12px/1 var(--f-mono);color:var(--ink-2)}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
svg .lbl{fill:var(--ink-2)}
svg .val{fill:var(--ink);font-weight:700}
.kpis{overflow-x:auto;border:1px solid var(--rule);background:var(--panel)}
.kpis table{width:100%;border-collapse:collapse;min-width:620px;font-variant-numeric:tabular-nums}
.kpis th,.kpis td{padding:12px 16px;text-align:right;border-bottom:1px solid var(--rule)}
.kpis th:first-child,.kpis td:first-child{text-align:left}
.kpis thead th{font:700 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpis tbody td{font:400 15px/1.2 var(--f-body);white-space:nowrap}
.kpis tbody td:first-child{font-weight:600}
.kpis .big{font:700 20px/1 var(--f-display)}
.kpis tr:last-child td{border-bottom:0}
.thesis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:0;border-top:2px solid var(--ink)}
.thesis div{padding:16px 18px 16px 0;border-bottom:1px solid var(--rule);min-width:0}
.thesis div+div{padding-left:18px;border-left:1px solid var(--rule)}
.thesis b{display:block;font:700 15px/1.3 var(--f-display);margin-bottom:6px}
.thesis p{margin:0;font-size:14px;color:var(--ink-2)}
@media (max-width:760px){.thesis div+div{padding-left:0;border-left:0}}
.gaps{display:grid;gap:14px}
.gap{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:18px;background:var(--panel);border:1px solid var(--rule);padding:20px}
@media (max-width:640px){.gap{grid-template-columns:1fr}}
.gap .evid{display:grid;gap:4px;align-content:start}
.gap .evid .num{font:800 34px/1 var(--f-display);color:var(--accent)}
.gap .evid .cap{font:400 12px/1.35 var(--f-mono);color:var(--muted)}
.gap h3{font:700 18px/1.25 var(--f-display);margin:0 0 6px}
.gap p{margin:0 0 8px;color:var(--ink-2);font-size:14.5px}
.gap .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:700 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--rule);color:var(--ink-2)}
.tag.hi{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tag.risk{border-color:var(--alert);color:var(--alert);background:var(--alert-soft)}
.tbl{overflow-x:auto;border:1px solid var(--rule);background:var(--panel)}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:760px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.tbl thead th{font:700 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.tbl td.r,.tbl th.r{text-align:right}
.bar{height:8px;background:var(--accent);display:inline-block;vertical-align:middle;border-radius:0 2px 2px 0}
.chips{display:inline-flex;gap:4px}
.chip{font:700 10px/1 var(--f-mono);padding:4px 6px;color:var(--bg)}
.chip.T{background:var(--s-t)} .chip.R{background:var(--s-r)} .chip.B{background:var(--s-b)} .chip.I{background:var(--s-i)} .chip.P{background:var(--s-p)} .chip.V{background:var(--s-v)}
.seg{font-size:12.5px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls input{font:inherit;padding:8px 12px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);min-width:0;flex:1 1 14rem}
.seg-btns{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);max-width:100%}
.seg-btns button{font:700 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;background:var(--panel);color:var(--ink-2);border:0;cursor:pointer}
.seg-btns button+button{border-left:1px solid var(--rule)}
.seg-btns button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{font:700 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;background:transparent;color:var(--accent);border:1px solid var(--accent);cursor:pointer;justify-self:start}
.count{font:400 12px/1 var(--f-mono);color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font:400 12px/1.45 var(--f-body);padding:8px 10px;max-width:260px;z-index:10;opacity:0;transition:opacity .1s}
#tip b{font-family:var(--f-display)}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:14px 28px;font-size:14px;color:var(--ink-2)}
.method p{margin:0}
.method b{color:var(--ink)}
.intro{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px}
@media (max-width:860px){.intro{grid-template-columns:1fr}}
.intro p{margin:0 0 12px;color:var(--ink-2);max-width:66ch}
.toc{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--rule)}
.toc li{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.toc li b{color:var(--ink);font-family:var(--f-display)}
.toc .n{font:700 12px/1.6 var(--f-mono);color:var(--accent)}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.funnel div{background:var(--panel);padding:16px;display:grid;gap:6px;align-content:start}
.funnel .v{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.funnel .l{font:400 12px/1.35 var(--f-mono);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:18px}
.steps li{display:grid;gap:6px;align-content:start;border-top:2px solid var(--accent);padding-top:12px;font-size:14px;color:var(--ink-2)}
.steps b{font:700 15px/1.25 var(--f-display);color:var(--ink)}
.steps .n{font:700 12px/1 var(--f-mono);color:var(--accent)}
.source{border:1px solid var(--rule);background:var(--panel);padding:16px 18px;font-size:14px;color:var(--ink-2)}
.source b{color:var(--ink)}
.benef{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:0;border-top:2px solid var(--ink)}
.benef div{padding:14px 18px 14px 0;border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.benef b{display:block;font:700 15px/1.3 var(--f-display);color:var(--ink);margin-bottom:4px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:14px}
.plan{border:1px solid var(--rule);background:var(--panel);padding:20px;display:grid;gap:10px;align-content:start}
.plan.feat{border:2px solid var(--accent)}
.plan .pn{font:700 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plan.feat .pn{color:var(--accent)}
.plan .pp{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.plan .pp small{font:400 13px/1 var(--f-body);color:var(--muted)}
.plan ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);display:grid;gap:4px}
.plan .who{font-size:13px;color:var(--muted);margin:0}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font:400 12px/1.5 var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}

.ai{margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px}
.ai summary{list-style:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:700 13px/1 var(--f-display);color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:9px 14px;user-select:none}
.ai summary::-webkit-details-marker{display:none}
.ai summary:hover{border-color:var(--accent)}.ai summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ai summary .ic{font-size:14px;line-height:1}.ai summary .ch{transition:transform .15s}.ai[open] summary .ch{transform:rotate(180deg)}
.ai .aib{margin-top:12px;display:grid;gap:8px}
.ai .aib p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}.ai .aib p b{color:var(--ink)}
.ai .aib .ft{font-size:12px;color:var(--muted)}
@media print{.ai summary{display:none}.ai .aib{display:grid!important}.ai{border-top:0}}
@media (prefers-reduced-motion:reduce){.ai summary .ch{transition:none}}
</style>
<style>#t-rev-ht td{white-space:normal}#t-rev td.r,#t-comp td.r{white-space:nowrap}
.xp-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;padding:28px 0 8px}

.xp-note{color:var(--ink-2);font-size:15px;line-height:1.6;max-width:70ch;margin:6px 0 0}

</head><body><style>
/* Login: cartão escuro centralizado, selo da marca em destaque, piso em grade em perspectiva ao fundo */
:root{--g-bg:#060A10;--g-card:#0E1B2A;--g-card-2:#0B1622;--g-line:#1F3247;--g-ink:#EEF1F5;--g-mut:#8C9AAB;--g-gold:#E3B95C;--g-gold-2:#C99A3E;--g-err:#F08A7E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-bg:#060A10;--g-card:#0E1B2A}}
:root[data-theme="dark"]{--g-bg:#060A10;--g-card:#0E1B2A}
body.locked{background:var(--g-bg);min-height:100vh;margin:0;overflow-x:hidden}
#gate{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;box-sizing:border-box;font-family:var(--f-body);color:var(--g-ink);background:radial-gradient(60% 50% at 50% 0%,#0F2236 0%,var(--g-bg) 70%)}
#gate::after{content:"";position:absolute;left:-50%;right:-50%;bottom:0;height:42vh;pointer-events:none;background-image:linear-gradient(#16263A 1px,transparent 1px),linear-gradient(90deg,#16263A 1px,transparent 1px);background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;mask-image:linear-gradient(to top,#000 0%,transparent 90%);-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 90%);opacity:.7}
.g-card{position:relative;z-index:1;width:100%;max-width:520px;background:linear-gradient(180deg,var(--g-card) 0%,var(--g-card-2) 100%);border:1px solid var(--g-line);border-radius:22px;padding:40px 36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.55);box-sizing:border-box}
.g-seal{width:104px;height:104px;margin:0 auto 18px;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(227,185,92,.5),0 0 48px rgba(227,185,92,.28)}
.g-seal img{width:84px;height:84px;object-fit:contain}

.g-sub{font:700 12px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--g-mut);text-align:center;margin:12px 0 0}
.g-tag{font:600 14px/1.4 var(--f-body);color:var(--g-gold);text-align:center;margin:18px 0 26px}
.g-f{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.g-f label{font:700 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#B4C0CE}
.g-f label small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--g-mut)}
.g-f input{font:400 16px/1.2 var(--f-body);color:var(--g-ink);background:#0A1520;border:1px solid var(--g-line);border-radius:12px;padding:15px 16px;outline:none;width:100%;box-sizing:border-box;transition:border-color .15s,box-shadow .15s}
.g-f input::placeholder{color:#5D6C7E}
.g-f input:focus{border-color:var(--g-gold);box-shadow:0 0 0 3px rgba(227,185,92,.18)}
.g-f input[aria-invalid="true"]{border-color:var(--g-err)}
.g-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g-sep{height:1px;background:var(--g-line);margin:6px 0 20px}
.g-btn{width:100%;margin-top:6px;border:0;border-radius:12px;padding:17px;font:800 17px/1 var(--f-display);color:#10161D;background:linear-gradient(90deg,var(--g-gold),var(--g-gold-2));cursor:pointer;transition:filter .15s,transform .05s}
.g-btn:hover{filter:brightness(1.06)}.g-btn:active{transform:translateY(1px)}.g-btn[disabled]{opacity:.7;cursor:progress}
.g-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.g-msg{min-height:20px;margin:12px 0 0;font:500 14px/1.4 var(--f-body);color:var(--g-err);text-align:center}
.g-foot{margin-top:18px;text-align:center;font:400 13px/1.65 var(--f-body);color:var(--g-mut)}
.g-foot b{color:#C8D1DC;font-weight:600}
@media (max-width:480px){.g-card{padding:30px 20px 24px;border-radius:18px}.g-row{grid-template-columns:1fr;gap:0}.g-t{font-size:23px}}
@media (prefers-reduced-motion:reduce){.g-f input,.g-btn{transition:none}}
